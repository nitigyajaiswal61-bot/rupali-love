<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Queen Rupali ❤️</title>

<style>
body{
margin:0;
padding:0;
font-family:Segoe UI;
background:linear-gradient(to right,#ff758c,#ff7eb3);
color:white;
text-align:center;
}

.container{
padding:20px;
}

.photo{
width:180px;
height:180px;
margin:20px auto;
background:url('rupali.jpg') center/cover;
border-radius:50%;
border:5px solid white;
}

.shayari{
background:rgba(255,255,255,0.2);
margin:15px auto;
padding:15px;
border-radius:15px;
max-width:600px;
font-size:18px;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:25px;
cursor:pointer;
background:white;
color:#ff4e88;
font-weight:bold;
margin:10px;
}

#proposal{
display:none;
font-size:22px;
margin-top:20px;
color:yellow;
}
</style>
</head>

<body>

<div class="container">

<h1>💖 My Beautiful Wife Rupali 💖</h1>

<div class="photo"></div>

<div class="shayari">
🌹 Rupali, teri muskaan meri pehchaan hai,  
Teri khushi meri jaan hai. 🌹
</div>

<div class="shayari">
❤️ Tere bina adhuri meri zindagi,  
Tu hi meri duniya, tu hi meri mohabbat hai. ❤️
</div>

<!-- 🎵 DIRECT AUDIO PLAYER -->
<audio controls autoplay loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<button onclick="propose()">💍 Special Surprise</button>

<div id="proposal">
💍 Rupali, Will You Stay With Me Forever? ❤️👑  
<br><br>
I Love You Beyond Infinity 💖✨
</div>

</div>

<script>
function propose(){
document.getElementById("proposal").style.display="block";
}
</script>

</body>
</html>
